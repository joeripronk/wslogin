; Example configuration for sso login for wslogin.
; Copy to /etc/wslogin/auth.ini and adjust, or generate it from the Apache
; auth server configuration with sync-auth-conf.sh.
; The configuration file to read can be overridden with the environment
; variable WSLOGIN_AUTH_CONFIG.
; Without this file sso login is disabled.

; name of the session cookie set by the auth server (SessionCookieName)
cookie_name=joerises

; domain of the cookie (domain= attribute of SessionCookieName). Requests
; are only accepted for hosts within this domain.
cookie_domain=joeri.nu

; shared secret of the auth server session cookie (SessionCryptoPassphrase).
; Repeat the option to accept several passphrases for decryption, the first
; one is the current passphrase of the auth server.
passphrase=fwe9f7gw8e6g8gdfwe967gwefew76985

; verify sso logins with authenticate-pam before the session is
; started: the password stored in the auth server session (the one
; entered at the auth server) is verified against the PAM service
; pam_service below. Set to false to skip the PAM check and rely on
; the cookie alone. Sessions whose cookie does not store a password
; always fall back to the login form.
verify_password=true

; PAM service used for the sso verification (requires verify_password)
pam_service=wslogin

; sso logins are only allowed for members of this group (checked against
; /etc/group, primary group included). Empty allows all users with a
; valid auth server session.
sso_group=wslogin-sso
