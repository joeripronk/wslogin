; Example configuration for receiver.js, the receiving side of the
; session upload feature. Start it with:
;   WSLOGIN_CONFIG=/etc/wslogin/receiver.ini node receiver.js
;
; See RECEIVER.md for the protocol and uploader.js for the sending side.

; Layout of sessions that are still running, relative to receiver_data_dir.
; Snapshots are written here; when the final copy arrives the session is moved
; to receiver_store_template. Placeholders: <hostname>, <username>, <session>,
; <kind> and <%date FORMAT>.
receiver_active_template=active/<hostname>/<username>/<session>.json

; Port the receiver listens on. It uses the shared [https] section for tls.
receiver_port=9023

; Directory where received sessions are stored. Relative paths are resolved
; against the directory of receiver.js.
receiver_data_dir=uploads

; Largest accepted session log, in bytes.
receiver_max_size=67108864

; Reject hosts that have no hostkey.hash in their upload directory. The hash
; file lives at <receiver_data_dir>/<hostname>/hostkey.hash and contains
; the SHA-256 of the host's upload_hostkey.
receiver_require_hostkey=false

; Layout of a completed session, relative to receiver_data_dir.
; Placeholders: <hostname>, <username>, <session>, <kind> and <%date FORMAT>,
; where FORMAT uses YYYY, YY, mm (month), dd (day), HH, MM (minutes) and ss.
; The date is the session start date, taken from the first record of the log.
; This example groups sessions by the day they started:
receiver_store_template=archive/<%date YYYY-mm-dd>/<hostname>/<username>/<session>.json

[https]
; Enable tls. When no key and cert are configured a self-signed certificate is
; generated automatically.
active=false

; certificate and key to use, relative to the directory of receiver.js
;key=ssl/private.key
;cert=ssl/cert.crt

; allow plain ws next to wss on the same port
;allow_http=true
