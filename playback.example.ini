; Configuration for the standalone playback server (playback-server.js).
; It serves the viewer and the playback API without starting a terminal
; websocket server, so it can run next to wslogin.service.
; Option names are case sensitive.

; address and port of the playback HTTP server. it is meant to be proxied by
; Apache and is bound to localhost by default.
port=9024
bind_address=127.0.0.1

playback_enabled=true

; local session logs written by server.js.
playback_session_dir=/opt/wslogin/sessions
playback_session_template=<username>/<session>.json

; completed sessions received by receiver.js.
playback_archive_dir=/var/lib/wslogin-uploads/archive
playback_archive_template=<%date YYYY-mm-dd>/<hostname>/<username>/<session>.json

; bundled viewer and playback cache.
playback_www_dir=/opt/wslogin/sudovideo
playback_cache_dir=/var/cache/wslogin-playback

; require PAM authentication (HTTP Basic) for the API.
playback_auth=true
playback_auth_service=sshd

; checkpoint interval and size. checkpoints let the viewer seek without
; replaying a session from the beginning.
playback_checkpoint_interval_ms=60000
playback_checkpoint_bytes=1048576
playback_max_checkpoints=500

; a local log that has not changed for this many seconds is shown as inactive.
playback_active_seconds=60

; skip long idle periods during playback. when the next event is more than
; playback_idle_skip_seconds away, playback jumps over the gap and plays the
; configured time-card video instead. the video is relative to
; playback_www_dir. set seconds to 0 to disable.
playback_idle_skip_enabled=true
playback_idle_skip_seconds=300
playback_idle_video=onehour.mp4
; seconds to wait before showing the video. a small skip overlay
; appears after playback_idle_overlay_delay_seconds.
playback_idle_video_delay_seconds=5
playback_idle_overlay_delay_seconds=1
; auto-skip the skip overlay after this many seconds (0 disables).
playback_idle_auto_skip_seconds=10
; auto-skip the movie after this many seconds (0 waits for the
; movie to end).
playback_idle_movie_auto_skip_seconds=0
