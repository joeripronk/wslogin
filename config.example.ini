; Example configuration for wslogin.
; Copy to /etc/wslogin/config.ini and adjust.
; The configuration file to read can be overridden with the environment
; variable WSLOGIN_CONFIG.
; Option names are case sensitive.

; port the server listens on, plain http and https are served on the same port
port=9022

; directory where the cookies of local (reconnectable) sessions are stored.
; when it is not set, local sessions are disabled.
cookie_dir=/opt/wslogin/cookies

; directory where the terminal session logs and checkpoints are stored.
; relative paths are resolved against the directory of the server.
; defaults to the sessions directory next to the server (sessions/)
;session_dir=sessions

; layout of an active session log, relative to session_dir. only <username>
; and <session> may be used, and the template must end in .json. server.js
; writes the log here and uploader.js scans the same template.
;session_template=<username>/<session>.json

; session playback API and bundled viewer (served under /playback/).
; playback reads session_dir again; playback_session_dir can point at another
; directory, for example a local copy of archived sessions.
;playback_enabled=true
;playback_session_dir=sessions
;playback_session_template=<username>/<session>.json
;playback_www_dir=sudovideo

; optional archive produced by receiver.js. Point this at receiver_data_dir's
; archive directory to list completed sessions next to local active logs.
; the archive uses the same date/hostname/user/session layout by default.
;playback_archive_dir=/var/lib/wslogin-uploads/archive
;playback_archive_template=<%date YYYY-mm-dd>/<hostname>/<username>/<session>.json

; directory for playback checkpoints. these are separate from the checkpoints
; written next to active logs by the server.
;playback_cache_dir=playback-cache

; require PAM authentication (HTTP Basic) for session listing and playback.
; playback_auth_service is the PAM service used for authentication.
;playback_auth=true
;playback_auth_service=sshd

; how often a playback checkpoint is stored, and the minimum number of new log
; bytes between checkpoints. the oldest checkpoints are thinned out when more
; than playback_max_checkpoints are stored for a session.
;playback_checkpoint_interval_ms=60000
;playback_checkpoint_bytes=1048576
;playback_max_checkpoints=500

; a session whose log has not been written for this many seconds is shown as
; inactive when it is not currently open in server.js.
;playback_active_seconds=60

; skip long idle periods during playback. when the next event is more than
; playback_idle_skip_seconds away, playback jumps over the gap and plays the
; configured time-card video instead. set seconds to 0 to disable.
;playback_idle_skip_enabled=true
;playback_idle_skip_seconds=10
;playback_idle_video=onehour.mp4
;; seconds to wait before showing the video. a small skip overlay
;; appears after playback_idle_overlay_delay_seconds.
;playback_idle_video_delay_seconds=5
;playback_idle_overlay_delay_seconds=1
;; only play the video for gaps of at least this many seconds. shorter gaps
;; show the skip overlay only. set 0 to always play the video.
;playback_idle_skip_seconds_show_video=600
;; auto-skip the skip overlay after this many seconds (0 disables).
;playback_idle_auto_skip_seconds=10
;; auto-skip the movie after this many seconds (0 waits for the
;; movie to end).
;playback_idle_movie_auto_skip_seconds=0

; playback can also run as a separate HTTP server next to server.js. see
; playback.example.ini and install-playback.sh. when it does, set
; playback_enabled=false here so only the standalone service serves playback.
;playback_enabled=false

; origin used when a client connects without an Origin header
origin=https://ssh.joeri.nu/

; checkpointing of terminal sessions, so a session can be replayed after a
; reconnect. Checkpoints are written when the interval or the number of
; bytes is reached. Set the interval and the number of bytes to 0 to
; disable checkpointing.
checkpoint_enabled=true
checkpoint_interval_seconds=3600
checkpoint_bytes=1048576

; upload session logs to a remote receiver.
; the uploader runs as a separate process (uploader.js) that scans session_dir
; for active logs and finished sessions (renamed to *.done by the server).
; disabled by default. See RECEIVER.md for the protocol.
upload_enabled=false

; websocket endpoint the session logs are uploaded to (ws:// or wss://)
;upload_url=wss://uploads.example.com/upload

; how often to rescan session_dir as a safety net for missed filesystem
; events, in seconds. changes are normally picked up immediately by the file
; monitor, so this can stay large.
;upload_interval_seconds=60

; upload active (still running) sessions as periodic snapshots. finished logs
; are always uploaded.
;upload_active_enabled=true

; minimum number of seconds between snapshots of the same active session.
; defaults to 1, so changes are streamed to the receiver as they happen.
;upload_active_interval_seconds=1

; how long to wait after a filesystem event before uploading, in milliseconds.
; a burst of writes is coalesced into one snapshot.
;upload_watch_debounce_ms=500

; remove a finished session log and its checkpoint after it has been uploaded
; successfully, instead of renaming the log to *.uploaded. active session logs
; are never removed.
;upload_remove_uploaded=false

; maximum number of websocket connections used to upload. uploads are
; interleaved over a single connection; more connections are opened when the
; receiver cannot keep up, up to this maximum.
;upload_connections=4

; send buffer size (bytes) at which a connection counts as saturated and an
; extra connection is opened. the low water mark is a quarter of this value.
;upload_high_water_bytes=1048576

; identifier of this host. defaults to the system hostname.
;upload_hostname=shell.example.com

; optional secret that distinguishes this host from another host with the
; same hostname. stored and sent as-is, use a long random value.
;upload_hostkey=

; extra certificate authority used to verify the receiver certificate.
; relative paths are resolved against the directory of the server.
;upload_ca=/etc/wslogin/upload-ca.pem

; settings for the receiver (receiver.js). it uses the
; shared [https] section for tls.
;receiver_port=9023
;receiver_data_dir=uploads
;receiver_max_size=67108864
;receiver_require_hostkey=false

; where completed sessions are stored, relative to receiver_data_dir.
; placeholders: <hostname>, <username>, <session>, <kind> and
; <%date FORMAT> using YYYY, YY, mm (month), dd (day), HH, MM (minutes) and
; ss. the date is the session start date, taken from the first log record.
;receiver_store_template=<%date YYYY-mm-dd>/<hostname>/<username>/<session>.json

[https]
; enable https/wss. When neither key nor cert is configured, a self-signed
; certificate is generated automatically and reused on the next start.
; When key and cert are configured, https is enabled automatically.
active=false

; alias for active
;enabled=false

; certificate and key to use. Relative paths are resolved against the
; directory of the server.
;key=ssl/private.key
;cert=ssl/cert.crt

; passphrase of an encrypted private key
;passphrase=
;key_password=

; refuse plain http and ws connections, only serve https and wss.
; requires https to be enabled.
;allow_http=false
;alias for allow_http
;allow_plaintext=false

; directory used to store the generated self-signed certificate.
; defaults to /etc/wslogin/ssl, falling back to ./ssl
;cert_dir=/etc/wslogin/ssl

; extra subject alternative names for the generated self-signed certificate,
; separated by commas. The hostname and all local addresses are added
; automatically.
;alt_names=ssh.example.com,10.0.0.1

; validity in days of the generated self-signed certificate
;days=3650

; size of the rsa key of the generated self-signed certificate
;rsa_bits=2048

; common name of the generated self-signed certificate, defaults to the
; hostname of the server
;common_name=ssh.example.com
