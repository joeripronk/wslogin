# Minimal tmux config used by wslogin sessions.
# tmux only keeps the shell alive across a wslogin restart; hide its UI and
# pass every key straight through to the shell.
# xterm-256color: apps inside the pane talk to the browser terminal directly;
# tmux passes its escape sequences through transparently.
set -g default-terminal "xterm-256color"
set -ga terminal-features ",*:tocolor"
set -g status off
set -g mouse off
set -g prefix None
set -g prefix2 None
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g display-time 0
set -g repeat-time 0
set -g set-titles on
set -g set-titles-string '#T'
set -g pane-border-status off
set -g pane-border-indicators off
setw -g automatic-rename off
setw -g monitor-activity off
# New windows: login shell with a clean environment; env -i drops TMUX,
# TMUX_PANE, TERM_PROGRAM*, SUDO_*, SHLVL, PWD injected by tmux and sudo.
set -g default-command "exec env -i HOME=\"$HOME\" SHELL=\"$SHELL\" USER=\"$USER\" LOGNAME=\"$USER\" PATH=/usr/local/bin:/usr/bin:/bin LANG=en_US.UTF-8 COLORTERM=truecolor TERM=xterm-256color VIEWID=\"$VIEWID\" VIEWURL=\"$VIEWURL\" sh -c 'exec \"$SHELL\" -l'"
unbind-key -a
# tmux re-adds these to every pane after the global environment (spawn.c),
# so they cannot be removed from here; the shell profile unsets them.
set-environment -gu TMUX
set-environment -gu TMUX_PANE
set-environment -gu TERM_PROGRAM
set-environment -gu TERM_PROGRAM_VERSION
