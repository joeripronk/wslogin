# Minimal tmux config used by wslogin sessions.
# tmux only keeps the shell alive across a wslogin restart; hide its UI and
# pass every key straight through to the shell.
set -g status off
set -g mouse off
set -g prefix None
set -g prefix2 None
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g display-time 0
set -g repeat-time 0
set -g set-titles off
set -g pane-border-status off
set -g pane-border-indicators off
setw -g automatic-rename off
setw -g monitor-activity off
unbind-key -a
