  <style>
form {
  border: 3px solid #f1f1f1;
}

/* Full-width inputs */
input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* Set a style for all buttons */
button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

/* Add a hover effect for buttons */
button:hover {
  opacity: 0.8;
}

/* Extra style for the cancel button (red) */
.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

/* Center the avatar image inside this container */
.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
}

/* Avatar image */
img.avatar {
  width: 40%;
  border-radius: 50%;
}

/* Add padding to containers */
.container {
  padding: 16px;
}

/* The "Forgot password" text */
span.psw {
  float: center;
  padding: 16px;
}

  /* Change styles for span and cancel button on extra small screens */
  @media screen and (max-width: 300px) {
    span.psw {
      display: block;
      float: none;
    }
    .cancelbtn {
      width: 100%;
    }
  }
  </style>
  <style>

#snackbar.hide {
  visibility: visible;

}

#snackbar.show {
  visibility: visible;
  -webkit-animation: fadein 0.5s;

}

  @-webkit-keyframes fadein {
    from {top: 0; opacity: 0;}

  }

    to {top: 30px; opacity: 0.8;}

    to {top: 0; opacity: 0;}

  <body spellcheck="off" autocorrect="off" autocapitalize="none" >
    <div id="loginform">
      <form method=post onsubmit='return false;'>
        <div class="formcontainer">
          <label for="uname"><b>Username</b></label>
          <input type="text" placeholder="Enter Username" id="username" name="uname" required>

          <label for="psw"><b>Password</b></label>
          <input type="password" placeholder="Enter Password" id="password" name="psw" required>
          </label>

            <input id="rememberme" type="checkbox" checked="checked" name="remember"> Remember me
          </label>
        </div>

        </div>
      </form> 
    </div>
    <div id="fullmenu" onclick="showhidemenu()"></div>
    <div id="fullscreen" onclick="goFullScreen()">  <svg style="width:24px;height:24px" viewBox="0 0 24 24">
        <path fill="#fff" d="M5,5H10V7H7V10H5V5M14,5H19V10H17V7H14V5M17,14H19V19H14V17H17V14M10,17V19H5V14H7V17H10Z" />
      </svg></div>
      <div id="terminal"></div>
      <div id="reload" onclick="location.reload()">
        <svg style="height:100%;width:100%;" viewBox="0 0 24 24">
          <path fill="#999" d="M2 12C2 16.97 6.03 21 11 21C13.39 21 15.68 20.06 17.4 18.4L15.9 16.9C14.63 18.25 12.86 19 11 19C4.76 19 1.64 11.46 6.05 7.05C10.46 2.64 18 5.77 18 12H15L19 16H19.1L23 12H20C20 7.03 15.97 3 11 3C6.03 3 2 7.03 2 12Z" />
        </svg></div>
        <div id="snackbar"></div>
        <script>
var viewonly=false;
var shared=false;
var shareid=false;
var viewid=false;
var snackshowtimeout=false;
var snackhidetimeout=false;
window.onhashchange = function () { authenticated=false;location.reload();};
var menudiv=document.getElementById('fullmenu');

function copyToClipboard(text) {
  showsnack("copied "+text+" to the clipboard");
  if (window.clipboardData && window.clipboardData.setData) {
    // IE specific code path to prevent textarea being shown while dialog is visible.
    return clipboardData.setData("Text", text); 

  } else if (document.queryCommandSupported && document.queryCommandSupported("copy")) {
    var textarea = document.createElement("textarea");
    textarea.textContent = text;
    textarea.style.position = "fixed";  // Prevent scrolling to bottom of page in MS Edge.
    document.body.appendChild(textarea);
    textarea.select();
    try {
      return document.execCommand("copy");  // Security exception may be thrown by some browsers.
    } catch (ex) {
      console.warn("Copy to clipboard failed.", ex);
      return false;
    } finally {
      document.body.removeChild(textarea);
    }
  }
}

function updatemenu() {
  text="<ul>";
  //  if (viewid) text+="<li><a href='"+window.location.href+"#view="+viewid+"' target=_new>viewonly link</a></li>";
  //  if (shareid) text+="<li><a href='"+window.location.href+"#share="+shareid+"' target=_new>shared link</a></li>";
  if (viewid) text+="<li><div onclick=\"copyToClipboard('"+ window.location.href+"#view="+viewid+"')\">copy viewonly link</div></li>";
  if (shareid) text+="<li><div onclick=\"copyToClipboard('"+ window.location.href+"#share="+shareid+"')\">copy shared link</div></li>";
  text+="<li>Close menu</li>";
  text+="</ul>";
  menudiv.innerHTML=text;
  document.getElementById("fullscreen").oncontextmenu = function(e) {showmenu(e)};
}
function showsnack(text) {
  var x = document.getElementById("snackbar");
  x.className = "show";
  x.innerHTML+="<p>"+text+"</p>";
  if (snackshowtimeout) clearTimeout(snackshowtimeout);
  if (snackhidetimeout) clearTimeout(snackhidetimeout);
  snackhidetimeout=false;
  snackshowtimeout=false;
  snackshowtimeout=setTimeout(function(){
    snackshowtimeout=false; x.className = x.className.replace("show", "hide");
    snackhidetimeout=setTimeout(function() {
      snackhidetimeout=false; x.innerHTML="";x.className = x.className.replace("hide", "");
    },1000);


  }, 5000);
}
function fixMobile() {
  const screen = document.getElementsByClassName('xterm-screen');
  if (!screen) return;
  screen[0].setAttribute('contenteditable', 'true');
  screen[0].setAttribute('spellcheck', 'false');
  screen[0].setAttribute('autocorrect', 'off');
  screen[0].setAttribute('autocomplete', 'off');
  screen[0].setAttribute('autocapitalize', 'none');
}
function setViewid(id){
  viewid=id;
  updatemenu();
}
function setShareid(id){
  shareid=id;
  updatemenu();
}
function showhidemenu() {
  if (menudiv.style.display=="block") {
    menudiv.style.display="none";
  } else {
    menudiv.style.display="block";
  }
}
function showmenu(e) {
  e.preventDefault();
  showhidemenu();
  return false;
}

if (window.location.hash.substr(1,5) == 'view=') {
  viewonly=true;
}
if (window.location.hash.substr(1,6) == 'share=') {
  shared=true;
}
var authenticated=false;
var options = {
  scrollback: 10000,
  cursorBlink: true,
  bellStyle: 'visual',
  fontSize: 14,
  lineHeight: 1,
  theme: {
    background: '#2d0922',
    foreground: '#fbf9f4'
  },
  convertEol: false
};
var connected = false;
var terminaldiv=document.getElementById('terminal');
window.addEventListener("beforeunload", function(e){
  if (authenticated) {
    e.preventDefault();
    e.returnValue="";
    return ""
  } else {
    delete e['returnValue'];
  }
}, false);
// only support for SSL
var socket=false;
if (window.location.protocol == 'https:') {
  socket = new WebSocket('wss://'+window.location.host+window.location.pathname+'pty');
} else {
  socket = new WebSocket('ws://'+window.location.host+window.location.pathname+'pty');
}
const fitAddon = new FitAddon.FitAddon();
//const webglAddon = new WebglAddon.WebglAddon();

//background: '#2D2E2C',
var baseTheme = {
  foreground: '#F8F8F8',
  background: '#2E3436',
  selection: '#5DA5D533',
  black: '#1E1E1D',
  brightBlack: '#262625',
  red: '#CE5C5C',
  brightRed: '#FF7272',
  green: '#5BCC5B',
  brightGreen: '#72FF72',
  yellow: '#CCCC5B',
  brightYellow: '#FFFF72',
  blue: '#5D5DD3',
  brightBlue: '#7279FF',
  magenta: '#BC5ED1',
  brightMagenta: '#E572FF',
  cyan: '#5DA5D5',
  brightCyan: '#72F0FF',
  white: '#F8F8F8',
  brightWhite: '#FFFFFF'
};
// vscode-snazzy https://github.com/Tyriar/vscode-snazzy
var otherTheme = {
  foreground: '#eff0eb',
  background: '#282a36',
  selection: '#97979b33',
  black: '#282a36',
  brightBlack: '#686868',
  red: '#ff5c57',
  brightRed: '#ff5c57',
  green: '#5af78e',
  brightGreen: '#5af78e',
  yellow: '#f3f99d',
  brightYellow: '#f3f99d',
  blue: '#57c7ff',
  brightBlue: '#57c7ff',
  magenta: '#ff6ac1',
  brightMagenta: '#ff6ac1',
  cyan: '#9aedfe',
  brightCyan: '#9aedfe',
  white: '#f1f1f0',
  brightWhite: '#eff0eb'
};
var isBaseTheme = true;

//fontFamily: '"Cascadia Code", Menlo, monospace',
//fontFamily: '"UbuntuMono"',
var term = new window.Terminal({
  theme: baseTheme,
  cursorBlink: true,
  scrollback: 10000,
  bellStyle: 'visual',
  convertEol: false
});
term.onTitleChange(function (title) {
  document.title = title;
})
term.onData(function (data) {
  if (!viewonly) socket.send('\1'+data);
})
//terminaldiv.addEventListener(
window.addEventListener(
  'mouseup',
  (e) => {
    if (e.which==1 && term.hasSelection() && term.getSelection().length>1) copyToClipboard(term.getSelection());
    if (e.which==2) {
      navigator.clipboard.readText().then(text => {
        showsnack("Pasted:<div align=left><pre>"+text+"</pre></div>");
          if (authenticated) socket.send('\1'+text.replaceAll("\r\n","\r").replaceAll("\n","\r"));
          })
          }
          },
          false,
          );
          var resizewait=false;
          var resizepending=false;
          var loginform = document.getElementById('loginform');
          term.open(document.getElementById('terminal'));
          //      term.loadAddon(attachAddon); 
          term.loadAddon(fitAddon);
          //        term.loadAddon(webglAddon); 
          function resizeScreen () {
          if (viewonly) return;
          if (terminaldiv.style.display=="none") return;
          var geom=undefined;
          try {
          geom = fitAddon.proposeDimensions();
          } catch(e) {
          console.log(e);
          }
          if (geom==undefined) {
          setTimeout(function() { resizeScreen(); },200);
          } else {
          if (term.cols!= geom.cols || term.rows != geom.rows) {
          if(authenticated){
          if (resizewait) { 
          resizepending=true; 
          } else {
          socket.send('\0{"cmd":"resize","cols":' +  geom.cols + ',"rows":' + geom.rows + '}');
          resizewait=setTimeout(function() { resizewait=false;if (resizepending) resizeScreen(); },150);
          }
          }
          }

          }
          }

          socket.onclose = function (connection) {
          if(connected) {
          //  console.log('connection closed');
          term.writeUtf8("\r\nConnection closed         \r\n");
          connected=false;
          authenticated=false;
          loginform.style.display="none";
          } else {
          term.writeUtf8("\rConnection failed\r\n");
          showsnack("Failed to connect");
          loginform.style.display="none";
          }
          if (!viewonly) {
          var rel = document.getElementById("reload");
          rel.style.display="block";
          //  resizeScreen();
          }
          };
          socket.onopen = function (connection) {
          connected=true;
          //console.log('connection opened');
          resizeScreen();
          window.addEventListener('resize', resizeScreen, false);
          };
          socket.onmessage = function (message) {
          var data=message.data.substr(1);
          switch (message.data[0]) {
          case '\0':
          var json = JSON.parse(data);
          switch(json.cmd) {
          case 'b64':
          // non utf 
          term.write(atob(json.data));
          break;;
          case 'resize':
          term.resize(json.cols,json.rows);
          break;;
          case 'cookie':
          document.cookie=json.cookie;
          break;;
          case 'login':
          if (viewonly) {
          if(connected) socket.send('\0{"cmd":"view","view":"' +  window.location.hash.substr(6) + '"}');
          } else if (shared) {
          if(connected) socket.send('\0{"cmd":"share","share":"' +  window.location.hash.substr(7) + '"}');
          } else {
          var formstatus=document.getElementById('formstatus');
          var usernameinput=document.getElementById('username');
          terminaldiv.style.display="none";
          formstatus.innerHTML="please login";
          loginform.style.display="block";
          usernameinput.focus();
          loginform.onsubmit=function (event) {
          event.preventDefault();
          // TODO: properly disable double submit
          //  loginform.onsubmit=function (event) { event.preventDefault(); return false; };
          var username=document.getElementById('username');
          var password=document.getElementById('password');
          terminaldiv.style.display="block";
          fitAddon.fit();
          terminaldiv.style.display="none";
          cmd={cmd:'login',username:username.value,password:password.value,rememberme:rememberme.value,cols:term.cols,rows:term.rows}
          socket.send('\0' + JSON.stringify(cmd));
          var formstatus=document.getElementById('formstatus');
          formstatus.innerHTML="Authenticating";
          return false;
          };
          }
          break;;
          case 'authfailed':
          terminaldiv.style.display="none";
          loginform.style.display="block";
          var formstatus=document.getElementById('formstatus');
          formstatus.innerHTML="<font color=red>Authentication failed</font>";
          break;;
          case 'replaydone':
          if (!viewonly) authenticated=true;
          terminaldiv.style.display="block";
          var formstatus=document.getElementById('formstatus');
          formstatus.innerHTML="";
          loginform.style.display="none";
          term.focus();
          setTimeout(function () {term.scrollToBottom();},200);
          break;;
          case 'reconnected':
          authenticated=true;
          if ('viewid' in json) setViewid(json.viewid);
          if ('shareid' in json) setShareid(json.shareid);
          terminaldiv.style.display="block";
          var formstatus=document.getElementById('formstatus');
          formstatus.innerHTML="";
          loginform.style.display="none";
          terminaldiv.style.display="block";
          term.focus();
          setTimeout(function () {term.scrollToBottom();},200);
          resizeScreen();
          break;;
          case 'authenticated':
          authenticated=true;
          if ('viewid' in json) setViewid(json.viewid);
          if ('shareid' in json) setShareid(json.shareid);
          terminaldiv.style.display="block";
          var formstatus=document.getElementById('formstatus');
          formstatus.innerHTML="";
          loginform.style.display="none";
          term.focus();
          break;;
          case "warn":
          showsnack(json.warn);
          break;;
          case "info":
          showsnack(json.info);
          break;;
          case "error":
          showsnack(json.error);
          break;;
          default: alert(data);
          }
          break;;
          case '\1':
          term.writeUtf8(data);
          break;;
          default:
          alert(message.data);
          }
          };
          function goFullScreen(){

          var elem = document.getElementById('terminal');

          if(elem.requestFullscreen){
          elem.requestFullscreen();
          }
          else if(elem.mozRequestFullScreen){
          elem.mozRequestFullScreen();
          }
          else if(elem.webkitRequestFullscreen){
          elem.webkitRequestFullscreen();
          }
          else if(elem.msRequestFullscreen){
          elem.msRequestFullscreen();
          }
          }
        </script>
